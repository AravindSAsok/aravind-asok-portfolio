<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title description">
  <title id="title">Backend and AI system architecture</title>
  <desc id="description">REST APIs, PostgreSQL, LLM and RAG services, and MCP tools connected to an AI orchestration core.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17314c" stroke-width="1" />
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102744" />
      <stop offset="1" stop-color="#0a192f" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#163b54" />
      <stop offset="1" stop-color="#0a192f" />
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#64ffda" stroke-width="1.4" />
    </marker>
  </defs>

  <rect width="640" height="640" rx="32" fill="#071426" />
  <rect width="640" height="640" rx="32" fill="url(#grid)" opacity=".72" />

  <g fill="none" stroke="#64ffda" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 184h48q30 0 30 30v49" stroke-width="2" opacity=".72" marker-end="url(#arrow)" />
    <path d="M435 184h-48q-30 0-30 30v49" stroke-width="2" opacity=".72" marker-end="url(#arrow)" />
    <path d="M205 456h48q30 0 30-30v-49" stroke-width="2" opacity=".72" marker-end="url(#arrow)" />
    <path d="M435 456h-48q-30 0-30-30v-49" stroke-width="2" opacity=".72" marker-end="url(#arrow)" />
    <circle cx="320" cy="320" r="144" stroke-width="1" stroke-dasharray="3 10" opacity=".38" />
  </g>

  <g>
    <rect x="52" y="126" width="153" height="116" rx="14" fill="url(#panel)" stroke="#2a5267" />
    <path d="M76 154h38m-38 12h26m-26 12h32" stroke="#64ffda" stroke-width="3" stroke-linecap="round" opacity=".8" />
    <text x="76" y="214" fill="#ccd6f6" font-family="monospace" font-size="14" letter-spacing="1.5">REST API</text>
  </g>

  <g>
    <rect x="435" y="126" width="153" height="116" rx="14" fill="url(#panel)" stroke="#2a5267" />
    <ellipse cx="511" cy="157" rx="24" ry="9" fill="none" stroke="#64ffda" stroke-width="2" />
    <path d="M487 157v30c0 5 11 9 24 9s24-4 24-9v-30m-48 15c0 5 11 9 24 9s24-4 24-9" fill="none" stroke="#64ffda" stroke-width="2" />
    <text x="459" y="220" fill="#ccd6f6" font-family="monospace" font-size="12" letter-spacing="1">POSTGRES</text>
  </g>

  <g>
    <rect x="52" y="398" width="153" height="116" rx="14" fill="url(#panel)" stroke="#2a5267" />
    <circle cx="85" cy="435" r="6" fill="#64ffda" />
    <circle cx="113" cy="425" r="5" fill="#64ffda" opacity=".8" />
    <circle cx="133" cy="447" r="5" fill="#64ffda" opacity=".65" />
    <path d="m91 433 17-6m9 2 12 14m-39-4 27 7" stroke="#64ffda" stroke-width="1.5" opacity=".7" />
    <text x="76" y="484" fill="#ccd6f6" font-family="monospace" font-size="12" letter-spacing=".5">LLM + RAG</text>
  </g>

  <g>
    <rect x="435" y="398" width="153" height="116" rx="14" fill="url(#panel)" stroke="#2a5267" />
    <path d="M476 428h71v37h-71zM488 440h10m8 0h29m-47 10h18m8 0h21" fill="none" stroke="#64ffda" stroke-width="2" stroke-linecap="round" />
    <text x="464" y="490" fill="#ccd6f6" font-family="monospace" font-size="12" letter-spacing="1">MCP TOOLS</text>
  </g>

  <g>
    <circle cx="320" cy="320" r="103" fill="#071426" stroke="#64ffda" stroke-width="1.5" opacity=".95" />
    <circle cx="320" cy="320" r="87" fill="url(#core)" stroke="#2c6571" stroke-width="1" />
    <path d="M285 301c12-16 28-24 47-24m23 10 12 19m-2 31c-8 20-24 34-45 39m-35-8-15-17m-4-28c1-6 3-11 6-16" fill="none" stroke="#64ffda" stroke-width="2" stroke-linecap="round" opacity=".55" />
    <circle cx="320" cy="320" r="48" fill="#0d2036" stroke="#64ffda" stroke-width="2" />
    <text x="320" y="325" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="28" font-weight="600" letter-spacing="3">AI</text>
    <text x="320" y="350" text-anchor="middle" fill="#a8b2d1" font-family="monospace" font-size="8" letter-spacing="1.5">ORCHESTRATION</text>
  </g>

  <g fill="#64ffda">
    <circle cx="320" cy="166" r="3" />
    <circle cx="320" cy="474" r="3" />
    <circle cx="166" cy="320" r="3" />
    <circle cx="474" cy="320" r="3" />
    <circle cx="236" cy="320" r="2" opacity=".7" />
    <circle cx="404" cy="320" r="2" opacity=".7" />
  </g>
</svg>
